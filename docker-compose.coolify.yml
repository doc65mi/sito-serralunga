# Serralunga su Coolify — Astro + Payload, database PostgreSQL di Coolify. Version: 1.05
# In Coolify: prima si crea il database (New Resource → Database → PostgreSQL), poi questa
# applicazione: New Resource → repository GitHub → Build Pack "Docker Compose",
# Docker Compose Location: /docker-compose.coolify.yml. Passi completi in DEPLOY.md,
# variabili pronte da incollare in coolify.env.example.
#
# - Il database è una risorsa separata di Coolify: backup programmati dal suo pannello,
#   e un nuovo deploy del sito non lo tocca mai. Qui arriva solo il suo indirizzo (DATABASE_URL).
#   Perché il sito lo raggiunga va spuntato "Connect to Predefined Network"
#   (Advanced → Docker Compose) e i due devono stare sullo stesso server e destinazione.
# - Nessuna porta pubblicata sul server: il dominio va assegnato al servizio `proxy` (porta 80).
# - PAYLOAD_SECRET e SITO_CHIAVE (SERVICE_PASSWORD_64_…) le genera Coolify e le conserva.
#   PAYLOAD_SECRET cifra anche le chiavi API dell'AI: se cambia, le chiavi vanno reinserite.
# - Dati da salvare: il database (backup di Coolify) e il volume `media` (foto e video caricati).
services:
  cms:
    build:
      context: .
      dockerfile: cms/Dockerfile
    restart: unless-stopped
    environment:
      # Indirizzo interno del database PostgreSQL creato in Coolify (campo "Postgres URL (internal)").
      DATABASE_URL: ${DATABASE_URL:?indirizzo interno del database PostgreSQL di Coolify, postgres://utente:password@host:5432/nome}
      PAYLOAD_SECRET: ${SERVICE_PASSWORD_64_PAYLOAD}
      SITO_CHIAVE: ${SERVICE_PASSWORD_64_SITOCHIAVE}
      # Vuoto: il pannello usa indirizzi relativi e funziona da qualunque nome (localhost, 127.0.0.1, dominio).
      CMS_URL: ""
      SITO_URL: ${SITO_URL}
      SEED_EMAIL: ${SEED_EMAIL:?email del primo utente del pannello}
      SEED_PASSWORD: ${SEED_PASSWORD:?password del primo utente del pannello}
      # 1 = al primo avvio, con il database vuoto, carica da solo utente, testi e foto di partenza.
      SEED_AUTOMATICO: ${SEED_AUTOMATICO:-1}
      # 1 = dopo un deploy con contenuti nuovi, aggiunge da solo ciò che manca (seed:aggiorna e
      # seed:catalogo in modalità prudente): non modifica mai i contenuti già presenti.
      AGGIORNAMENTO_AUTOMATICO: ${AGGIORNAMENTO_AUTOMATICO:-1}
      # Contenuti su GitHub (facoltativo: il token si può inserire anche nel pannello).
      CONTENUTI_GITHUB_TOKEN: ${CONTENUTI_GITHUB_TOKEN:-}
      NOTIFICHE_EMAIL: ${NOTIFICHE_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - media:/app/media
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/users/me || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 90s

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      cms:
        condition: service_healthy
    environment:
      CMS_INTERNAL_URL: http://cms:3000
      # Vuoto: le foto hanno indirizzi relativi, sempre sullo stesso indirizzo da cui si apre il sito.
      CMS_PUBLIC_URL: ""
      SITO_URL: ${SITO_URL}
      SITO_CHIAVE: ${SERVICE_PASSWORD_64_SITOCHIAVE}
      BLOCCA_INDICIZZAZIONE: ${BLOCCA_INDICIZZAZIONE:-1}
    expose:
      - "4321"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4321/robots.txt || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  proxy:
    build:
      context: ./proxy
    restart: unless-stopped
    depends_on:
      cms:
        condition: service_healthy
      web:
        condition: service_healthy
    expose:
      - "80"

volumes:
  media:
