# Serralunga su Coolify — Astro + Payload + Postgres. Version: 1.00
# In Coolify: New Resource → repository GitHub → Build Pack "Docker Compose",
# Docker Compose Location: /docker-compose.coolify.yml (passi completi in DEPLOY.md).
#
# - Nessuna porta pubblicata sul server: il dominio va assegnato al servizio `proxy` (porta 80).
# - Le password (SERVICE_PASSWORD_…) le genera Coolify al primo caricamento e le conserva.
# - Dati da salvare nei backup: volumi `db-dati` (database) e `media` (foto e video caricati).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: serralunga
      POSTGRES_USER: serralunga
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - db-dati:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serralunga -d serralunga"]
      interval: 5s
      timeout: 5s
      retries: 20

  cms:
    build:
      context: .
      dockerfile: cms/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://serralunga:${SERVICE_PASSWORD_POSTGRES}@db:5432/serralunga
      PAYLOAD_SECRET: ${SERVICE_PASSWORD_64_PAYLOAD}
      SITO_CHIAVE: ${SERVICE_PASSWORD_64_SITOCHIAVE}
      CMS_URL: ${SITO_URL:?indirizzo pubblico, per esempio https://www.serralunga.com}
      SITO_URL: ${SITO_URL}
      SEED_EMAIL: ${SEED_EMAIL:?email del primo utente del pannello}
      SEED_PASSWORD: ${SEED_PASSWORD:?password del primo utente del pannello}
      NOTIFICHE_EMAIL: ${NOTIFICHE_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - media:/app/media
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/users/me || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 90s

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      cms:
        condition: service_healthy
    environment:
      CMS_INTERNAL_URL: http://cms:3000
      CMS_PUBLIC_URL: ${SITO_URL}
      SITO_URL: ${SITO_URL}
      SITO_CHIAVE: ${SERVICE_PASSWORD_64_SITOCHIAVE}
      BLOCCA_INDICIZZAZIONE: ${BLOCCA_INDICIZZAZIONE:-1}
    expose:
      - "4321"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4321/robots.txt || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  proxy:
    build:
      context: ./proxy
    restart: unless-stopped
    depends_on:
      cms:
        condition: service_healthy
      web:
        condition: service_healthy
    expose:
      - "80"

volumes:
  db-dati:
  media:
