# Serralunga — Astro + Payload + Postgres. Version: 1.03
# Locale: copia .env.example in .env, poi `docker compose up -d --build`.
# Sito e pannello rispondono sulla stessa porta (servizio proxy): http://localhost:8080 e /admin.
# Coolify: usa docker-compose.coolify.yml (vedi DEPLOY.md).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: serralunga
      POSTGRES_USER: serralunga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD}
    volumes:
      - db-dati:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serralunga -d serralunga"]
      interval: 5s
      timeout: 5s
      retries: 20

  cms:
    build:
      context: .
      dockerfile: cms/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://serralunga:${POSTGRES_PASSWORD}@db:5432/serralunga
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?imposta PAYLOAD_SECRET}
      # Vuoto: il pannello usa indirizzi relativi e funziona da qualunque nome (localhost, 127.0.0.1, dominio).
      CMS_URL: ""
      SITO_URL: ${SITO_URL:-http://localhost:8080}
      SITO_CHIAVE: ${SITO_CHIAVE:?imposta SITO_CHIAVE}
      SEED_EMAIL: ${SEED_EMAIL:-}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      NOTIFICHE_EMAIL: ${NOTIFICHE_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - media:/app/media
    expose:
      - "3000"

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      - cms
    environment:
      CMS_INTERNAL_URL: http://cms:3000
      # Vuoto: le foto hanno indirizzi relativi, sempre sullo stesso indirizzo da cui si apre il sito.
      CMS_PUBLIC_URL: ""
      SITO_URL: ${SITO_URL:-http://localhost:8080}
      SITO_CHIAVE: ${SITO_CHIAVE}
      BLOCCA_INDICIZZAZIONE: ${BLOCCA_INDICIZZAZIONE:-1}
    expose:
      - "4321"

  proxy:
    build:
      context: ./proxy
    restart: unless-stopped
    depends_on:
      - cms
      - web
    ports:
      - "${PORTA:-8080}:80"

volumes:
  db-dati:
  media:
