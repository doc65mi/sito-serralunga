# Serralunga su Coolify, variante "tutto in uno" — Astro + Payload + Postgres. Version: 1.04
# Il database è un servizio di questo stesso file. Si usa solo se non si vuole creare
# il database PostgreSQL come risorsa di Coolify (scelta consigliata: docker-compose.coolify.yml).
# Docker Compose Location: /docker-compose.coolify-tutto.yml (passi in DEPLOY.md).
#
# - Nessuna porta pubblicata sul server: il dominio va assegnato al servizio `proxy` (porta 80).
# - Le password (SERVICE_PASSWORD_…) le genera Coolify al primo caricamento e le conserva.
# - Dati da salvare nei backup: volumi `db-dati` (database) e `media` (foto e video caricati).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: serralunga
      POSTGRES_USER: serralunga
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - db-dati:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serralunga -d serralunga"]
      interval: 5s
      timeout: 5s
      retries: 20

  cms:
    build:
      context: .
      dockerfile: cms/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://serralunga:${SERVICE_PASSWORD_POSTGRES}@db:5432/serralunga
      PAYLOAD_SECRET: ${SERVICE_PASSWORD_64_PAYLOAD}
      SITO_CHIAVE: ${SERVICE_PASSWORD_64_SITOCHIAVE}
      # Vuoto: il pannello usa indirizzi relativi e funziona da qualunque nome (localhost, 127.0.0.1, dominio).
      CMS_URL: ""
      SITO_URL: ${SITO_URL}
      SEED_EMAIL: ${SEED_EMAIL:?email del primo utente del pannello}
      SEED_PASSWORD: ${SEED_PASSWORD:?password del primo utente del pannello}
      # 1 = al primo avvio, con il database vuoto, carica da solo utente, testi e foto di partenza.
      SEED_AUTOMATICO: ${SEED_AUTOMATICO:-1}
      # 1 = dopo un deploy con contenuti nuovi, aggiunge da solo ciò che manca (seed:aggiorna e
      # seed:catalogo in modalità prudente): non modifica mai i contenuti già presenti.
      AGGIORNAMENTO_AUTOMATICO: ${AGGIORNAMENTO_AUTOMATICO:-1}
      NOTIFICHE_EMAIL: ${NOTIFICHE_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - media:/app/media
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/users/me || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 90s

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      cms:
        condition: service_healthy
    environment:
      CMS_INTERNAL_URL: http://cms:3000
      # Vuoto: le foto hanno indirizzi relativi, sempre sullo stesso indirizzo da cui si apre il sito.
      CMS_PUBLIC_URL: ""
      SITO_URL: ${SITO_URL}
      SITO_CHIAVE: ${SERVICE_PASSWORD_64_SITOCHIAVE}
      BLOCCA_INDICIZZAZIONE: ${BLOCCA_INDICIZZAZIONE:-1}
    expose:
      - "4321"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4321/robots.txt || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  proxy:
    build:
      context: ./proxy
    restart: unless-stopped
    depends_on:
      cms:
        condition: service_healthy
      web:
        condition: service_healthy
    expose:
      - "80"

volumes:
  db-dati:
  media:
